name: Discover exhibition image candidates
on:
  workflow_dispatch:
  schedule:
    - cron: '20 7 * * 1'
permissions:
  contents: write
jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/discover_images.py
      - name: Commit candidate report
        run: |
          git config user.name "expo-image-bot"
          git config user.email "expo-image-bot@users.noreply.github.com"
          git add image-candidates.json
          if ! git diff --cached --quiet; then
            git commit -m "Update exhibition image candidates (review required)"
            git push
          fi
